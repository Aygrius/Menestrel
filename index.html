<!DOCTYPE html>
<html lang="pt-BR">

<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menestrel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;600;700&family=Spectral:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" rel="stylesheet">

  <style>
    body {
      background: #06060a;
      margin: 0;
    }

    #__loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #06060a;
      z-index: 9999;
      transition: opacity .3s;
    }

    #__loading.gone {
      opacity: 0;
      pointer-events: none;
    }

    /* Opção A, "Respira" (23/10/2026): o selo grande pulsando e o arco de
       ouro em volta — o mesmo do Carregando (01-core/helpers.jsx). */
    #__loading { background: #120D08; flex-direction: column; }
    #__loading .selo-wrap { position: relative; width: 168px; height: 168px; display: grid; place-items: center; }
    #__loading .anel { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    #__loading .anel circle { fill: none; stroke-width: 2.5; }
    #__loading .anel .trilho { stroke: rgba(138,110,64,.25); }
    #__loading .anel .arco { stroke: #E0BE68; stroke-linecap: round; stroke-dasharray: 80 423; transform-origin: 50% 50%; animation: gira 1.6s linear infinite; }
    #__loading .selo { width: 132px; height: 132px; filter: drop-shadow(0 14px 22px rgba(0,0,0,.55)); animation: pulsa 2.4s ease-in-out infinite; }
    @keyframes gira { to { transform: rotate(360deg); } }
    @keyframes pulsa { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @media (prefers-reduced-motion: reduce) { #__loading .arco, #__loading .selo { animation: none; } }
  </style>
</head>

<body data-mode="grimoire">
  <script>
    // A paleta da última visita, antes do app montar (23/10/2026) — sem piscar.
    try { const v = localStorage.getItem('menestrel.paleta'); document.documentElement.dataset.paleta = (v === 'ferro' || v === 'couro') ? v : 'couro'; } catch (e) { document.documentElement.dataset.paleta = 'couro'; }
  </script>

  <div id="__loading">
    <div class="selo-wrap">
      <svg class="anel" viewBox="0 0 168 168" aria-hidden="true"><circle class="trilho" cx="84" cy="84" r="80"/><circle class="arco" cx="84" cy="84" r="80"/></svg>
      <img class="selo" src="/favicon.svg" alt="Menestrel">
    </div>
  </div>
  </div>

  <div class="page-edge"></div>
  <div class="page-edge right"></div>
  <div id="root"></div>

  <!-- Tira o loading screen quando o React monta -->
  <script>
    const obs = new MutationObserver(() => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0) {
        document.getElementById('__loading')?.classList.add('gone');
        setTimeout(() => document.getElementById('__loading')?.remove(), 400);
        obs.disconnect();
      }
    });
    obs.observe(document.getElementById('root'), { childList: true });
  </script>

  <!-- Entry do Vite. Substitui as libs de CDN, o Babel e todos os <script> de fase. -->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
